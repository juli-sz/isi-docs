# Este archivo va en el repo del VAULT: juli-sz/isi-docs
# Ruta exacta: .github/workflows/avisar-al-sitio.yml
#
# Cada vez que subís apuntes al vault, le avisa al repo del sitio
# (juli-sz/isi-docs-web) que rebuildee y republique.
#
# Requiere un secret llamado PAT_SITIO en este repo (ver README del sitio).

name: Avisar al sitio que hay contenido nuevo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch -> isi-docs-web
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_SITIO }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/juli-sz/isi-docs-web/dispatches \
            -d '{"event_type":"vault-updated"}'
